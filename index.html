
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compleanno Gioia Esposito</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fad0c4 100%);
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            max-width: 500px;
            width: 100%;
            padding: 30px;
            text-align: center;
            box-sizing: border-box;
        }
        h1 {
            color: #ff4757;
            margin-bottom: 10px;
        }
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
        }
        .details {
            background: #fff0f3;
            border-left: 5px solid #ff4757;
            padding: 15px;
            margin: 20px 0;
            text-align: left;
            border-radius: 5px;
        }
        .video-container {
            margin: 20px 0;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
        }
        video {
            width: 100%;
            border-radius: 10px;
        }
        .map-container {
            margin: 20px 0;
            border-radius: 10px;
            overflow: hidden;
            border: 2px solid #ddd;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
        }
        .btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 50px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: transform 0.2s, opacity 0.2s;
        }
        .btn:hover {
            transform: scale(1.05);
            opacity: 0.9;
        }
        .btn-yes {
            background-color: #2ed573;
        }
        .btn-no {
            background-color: #ff4757;
        }
        .surprise {
            margin-top: 20px;
            font-weight: bold;
            color: #e056fd;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Compleanno di Gioia</h1>
        <p>Festeggia insieme a noi questo giorno speciale!</p>

        <!-- Video della festa -->
        <div class="video-container">
            <video controls autoplay muted loop>
                <source src="video 1.mp4" type="video/mp4">
                Il tuo browser non supporta il tag video.
            </video>
        </div>

        <div class="details">
            <p><strong>📅 Data:</strong> 12 Dicembre</p>
            <p><strong>📍 Luogo:</strong> Masseria Michele, Napoli</p>
        </div>

        <!-- Mappa di Google Maps -->
        <div class="map-container">
            <iframe 
                width="100%" 
                height="220" 
                style="border:0;" 
                loading="lazy" 
                allowfullscreen 
                src="https://www.google.com/maps/embed/v1/place?key=INSERISCI_TUA_API_KEY&q=Masseria+Michele+Napoli">
            </iframe>
        </div>
        <p style="font-size: 0.9rem;"><a href="https://maps.google.com/?q=Masseria+Michele+Napoli" target="_blank">Apri la posizione su Google Maps</a></p>

        <!-- Mega Sorpresa Finale -->
        <div class="surprise">
            ✨ E alla fine... ci sarà una <strong>mega sorpresa</strong> per tutti! 🎁
        </div>

        <h3>Conferma la tua presenza:</h3>
        <div class="btn-group">
            <a href="https://wa.me/?text=Ciao!%20Confermo%20che%20CI%20SARÒ%20alla%2falla%20festa%20di%20Gioia!%20🎉" class="btn btn-yes" target="_blank">Sì, ci sarò</a>
            <a href="https://wa.me/?text=Ciao!%20Purtroppo%20NON%20POTRÒ%20esserci%20alla%20festa%20di%20Gioia.%20❤️" class="btn btn-no" target="_blank">No, non ci sarò</a>
        </div>
    </div>

</body>
</html>
