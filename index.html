<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Il Compleanno Magico di Gioia</title>
    <!-- Importazione del font ufficiale in stile Disney -->
    <link href="https://fonts.cdnfonts.com/css/waltograph" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: 'Waltograph', cursive, sans-serif;
            background: #000;
        }
        /* Contenitori video a tutto schermo */
        .fullscreen-video-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: opacity 1.5s ease;
        }
        #mainVideo {
            opacity: 0;
        }
        /* Overlay per disporre elementi sopra il video */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.2) 40%, rgba(10,10,30,0.85) 100%);
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            text-align: center;
            pointer-events: none;
        }
        .header-content, .footer-actions {
            pointer-events: auto;
        }
        .header-content {
            width: 100%;
            max-width: 480px;
        }
        h1 {
            font-family: 'Waltograph', cursive, sans-serif;
            color: #ffd700;
            font-size: 2.2rem;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.9), 0 0 20px rgba(255, 215, 0, 0.6);
            letter-spacing: 2px;
            margin-bottom: 2px;
        }
        .subtitle {
            font-size: 1.1rem;
            color: #fff;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9);
        }
        /* Pulsante audio in evidenza */
        .audio-btn {
            font-family: 'Waltograph', cursive, sans-serif;
            background: linear-gradient(45deg, #ff4757, #ff6b81);
            color: white;
            border: 2px solid #fff;
            padding: 8px 16px;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 8px;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.6);
            font-size: 1rem;
            letter-spacing: 1px;
            transition: transform 0.2s;
        }
        .audio-btn:hover {
            transform: scale(1.05);
        }
        /* Sezione inferiore con la sorpresa e i pulsanti */
        .footer-actions {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 10px;
        }
        .surprise-box {
            background: rgba(40, 15, 60, 0.85);
            border: 2px dashed #ff9ff3;
            padding: 10px 15px;
            border-radius: 12px;
            color: #ff9ff3;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
        }
        .btn-action {
            font-family: 'Waltograph', cursive, sans-serif;
            display: block;
            width: 100%;
            padding: 13px 20px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 1.2rem;
            letter-spacing: 1px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            border: 2px solid rgba(255,255,255,0.4);
            transition: transform 0.2s;
            text-align: center;
            color: white;
        }
        .btn-action:hover {
            transform: scale(1.03);
        }
        .btn-map {
            background: linear-gradient(45deg, #00b4d8, #0077b6);
        }
        .btn-yes {
            background: linear-gradient(45deg, #2ed573, #26af5f);
        }
    </style>
</head>
<body>

    <!-- Video a tutto schermo: Intro (video 3) e Invito principale (video 1) -->
    <div class="fullscreen-video-container">
        <!-- Intro del Castello (aggiunto muted per consentire l'autoplay immediato) -->
        <video id="introVideo" autoplay muted playsinline>
            <source src="video 3.mp4" type="video/mp4">
            Il tuo browser non supporta il tag video.
        </video>
        <!-- Video Principale -->
        <video id="mainVideo" loop muted playsinline style="position: absolute; top: 0; left: 0;">
            <source src="video 1.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Contenuti sovrapposti -->
    <div class="overlay">
        <div class="header-content">
            <h1>Il Compleanno di Gioia</h1>
            <div class="subtitle">✨ 2 Dicembre • Ore 18:00 • Masseria Michele ✨</div>
            <!-- Pulsante per attivare l'audio -->
            <button class="audio-btn" onclick="attivaAudio()">
                🔊 Attiva Audio
            </button>
        </div>

        <div class="footer-actions">
            <!-- Messaggio Mega Sorpresa -->
            <div class="surprise-box">
                🏰✨ Ci sarà una mega sorpresa incantata per tutti! 🎁🎉
            </div>

            <!-- 1° Pulsante: Google Maps -->
            <a href="https://maps.google.com/?q=Via+Ponti+Rossi+151+Napoli" target="_blank" class="btn-action btn-map">
                📍 Apri Masseria Michele su Maps
            </a>

            <!-- 2° Pulsante: Conferma Presenza su WhatsApp -->
            <a href="https://wa.me/393510689798?text=Ciao!%20Confermo%20che%20CI%20SARÒ%20al%20magico%20compleanno%20di%20Gioia%20il%202%20Dicembre%20alle%2018:00!%20👑✨" class="btn-action btn-yes" target="_blank">
                ✨ Sì, ci sarò! (WhatsApp)
            </a>
        </div>
    </div>

    <script>
        const intro = document.getElementById('introVideo');
        const main = document.getElementById('mainVideo');

        // Quando l'intro finisce, transizione al video principale
        intro.addEventListener('ended', function() {
            intro.style.opacity = '0';
            main.style.opacity = '1';
            main.play();
            setTimeout(() => {
                intro.style.display = 'none';
            }, 1500);
        });

        // Funzione per attivare l'audio su entrambi i video
        function attivaAudio() {
            intro.muted = false;
            main.muted = false;
            document.querySelector('.audio-btn').style.display = 'none';
        }
    </script>

</body>
</html>
